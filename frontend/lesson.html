<!DOCTYPE html>
<html>
<head>
    <title>Lesson</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body onload="initLessonPage()">

<div class="container">

    <h1 id="lessonTitle"></h1>

    <div id="lessonContent"></div>

    <div class="row">
        <button onclick="prevSection()">Back</button>
        <button onclick="nextSection()">Next</button>
    </div>

    <div class="card hidden" id="tutorCard">
        <textarea id="codeInput"></textarea>
        <button onclick="sendCode()">Analyse</button>
        <pre id="responseBox"></pre>
    </div>

</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/lesson_engine.js"></script>

<script>
async function initLessonPage() {

    await checkLogin();

    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id"));

    if (!id) {
        window.location.href = "/index.html";
        return;
    }

    const res = await fetch("http://127.0.0.1:5000/api/user/lesson-status", {
        credentials: "include"
    });

    const data = await res.json();

    const lesson = data.lessons.find(l => l.id === id);

    if (!lesson || !lesson.unlocked) {
        alert("🔒 Lesson locked");
        window.location.href = "/index.html";
        return;
    }

    currentLesson = id;
    currentSectionIndex = 0;

    await loadSection();
}
</script>
</body>
</html>
