<!DOCTYPE html>
<html>
<head>
    <title>AI Python Tutor</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body onload="loadDashboard()">

<div class="container">

    <h1>Choose a Lesson</h1>

    <p id="userInfo">Loading...</p>

    <!-- CONTINUE BUTTON -->
    <div id="continueBox"></div>

    <!-- LESSON LIST -->
    <div id="lessonList"></div>

    <button onclick="logout()">Logout</button>

</div>

<script src="js/auth.js"></script>

<script>
async function loadDashboard() {

    await checkLogin();

    const res = await fetch("http://127.0.0.1:5000/api/user/lesson-status", {
        credentials: "include"
    });

    const data = await res.json();

    if (!data.success) return;

    const container = document.getElementById("lessonList");
    container.innerHTML = "";

    data.lessons.forEach(l => {

        const card = document.createElement("div");
        card.className = "lesson-card";

        let statusText = "";

        // PURE BACKEND TRUTH ONLY
        if (l.completed) {
            statusText = "✅ Completed";
        }
        else if (l.current) {
            statusText = "▶ Continue Learning";
        }
        else if (l.unlocked) {
            statusText = "🟢 Available";
        }
        else {
            statusText = "🔒 Locked";
        }

        card.innerHTML = `
            <h3>${l.title}</h3>
            <p>${statusText}</p>
            ${l.unlocked ? `
                <button onclick="openLesson(${l.id})">
                    ${l.completed ? "Review" : (l.current ? "Continue" : "Start")}
                </button>
            ` : ""}
        `;

        container.appendChild(card);
    });
}

function openLesson(id) {
    window.location.href = `/lesson.html?id=${id}`;
}
</script>

</body>
</html>
